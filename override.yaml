# SubStore YAML 格式覆写
# 用途：国外走代理 / 国内走直连
#
# 使用方法：
#   将此文件放到 GitHub 公开仓库
#   这是 YAML 覆写文件，不是快捷脚本
#   不要放在 SubStore 的“脚本操作”里执行
#   需要把它用于支持 YAML 覆写/配置覆写的入口
#
# 此文件控制：基础设置、DNS、域名嗅探、代理组、路由规则
# 节点由 SubStore 自动从你的订阅注入，不需要在这里填写


# ── 基础设置 ──────────────────────────────────────────────────────

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""
unified-delay: true
tcp-concurrent: true

# IP-ASN 规则使用的数据库
geox-url:
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# ── DNS ───────────────────────────────────────────────────────────

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "*.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
    - "time.*.com"
    - "ntp.*.com"
    - "ntp.aliyun.com"
    - "+.ntp.org.cn"
    - "stun.*.*"
    - "stun.*.*.*"
    - "localhost.ptlogin2.qq.com"
    - "router.asus.com"
    # Google Play 下载域名走真实 DNS，避免 Fake-IP 导致 DownloadManager 路由失败
    - "*.gvt1.com"
    - "services.googleapis.cn"
    - "android.clients.google.com"
    - "*.dl.google.com"
    - "*.googleapis.cn"
    - "googleapis.cn"
    - "*.googleapis.com"
    # Google Play 国内 CDN 下载域名走真实 DNS，走代理反而卡住
    - "xn--ngstr-lra8j.com"
    - "clientservices.googleapis.com"
    - "update.googleapis.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "+.steamserver.net":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "+.steamcontent.com":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "+.steamchina.com":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "+.cm.steampowered.com":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "geosite:cn,private,steam@cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "geosite:google":
      - "https://dns.google/dns-query#🚀 代理"
      - "https://cloudflare-dns.com/dns-query#🚀 代理"
    "geosite:geolocation-!cn":
      - "https://dns.google/dns-query#🚀 代理"
      - "https://cloudflare-dns.com/dns-query#🚀 代理"
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query


# ── 域名嗅探 ──────────────────────────────────────────────────────

sniffer:
  enable: true
  sniffing:
    - tls
    - http
  skip-domain:
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "ntp.*.com"
    - "ntp.aliyun.com"


# ── 代理组 ────────────────────────────────────────────────────────

proxy-groups:

  - name: "🚀 代理"
    type: select
    proxies:
      - "🔄 故障转移"
      - "✋ 手动选择"

  - name: "🔄 故障转移"
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
    timeout: 2000
    max-failed-times: 3
    include-all: true

  - name: "✋ 手动选择"
    type: select
    include-all: true


# ── 路由规则 ──────────────────────────────────────────────────────

rules:
  # 指定域名直连
  - DOMAIN-SUFFIX,3q.hair,DIRECT
  - DOMAIN-SUFFIX,odn.cc,DIRECT
  # Steam 下载与内容服务器直连
  - DOMAIN-SUFFIX,steamserver.net,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamchina.com,DIRECT
  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - DOMAIN,steampipe.akamaized.net,DIRECT
  - DOMAIN,steampipe-kr.akamaized.net,DIRECT
  - DOMAIN,steampipe-partner.akamaized.net,DIRECT
  - DOMAIN,steam.apac.qtlglb.com,DIRECT
  - DOMAIN,steam.eca.qtlglb.com,DIRECT
  - DOMAIN,steam.naeu.qtlglb.com,DIRECT
  - DOMAIN,steam.ru.qtlglb.com,DIRECT
  - DOMAIN,edge.steam-dns.top.comcast.net,DIRECT
  - DOMAIN,steam.cdn.on.net,DIRECT
  - DOMAIN,steam.cdn.orcon.net.nz,DIRECT
  - DOMAIN,steam.cdn.slingshot.co.nz,DIRECT
  - DOMAIN,steam.cdn.webra.ru,DIRECT
  # Google 服务 CDN 下载走直连（国内 CDN，走代理反而卡住 — OpenClash #3131/#4064 公认修复）
  - DOMAIN-SUFFIX,xn--ngstr-lra8j.com,DIRECT
  - DOMAIN,services.googleapis.cn,DIRECT
  - DOMAIN,clientservices.googleapis.com,DIRECT
  - DOMAIN,update.googleapis.com,DIRECT
  # Google 其他服务走代理（GEOSITE 兜底，在 CN 规则之前）
  - GEOSITE,google,🚀 代理
  # Steam 国内下载节点直连，商店和其余 Steam 域名走代理
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,🚀 代理
  # 直接访问 Valve 内容服务器 IP 时走直连；置于 Steam 域名规则之后，避免商店误命中
  - IP-ASN,32590,DIRECT
  # 局域网直连
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  # 国内直连
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  # 其余走代理
  - MATCH,🚀 代理
