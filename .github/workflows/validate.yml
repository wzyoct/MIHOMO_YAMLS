name: Validate configurations

on:
  pull_request:
    paths:
      - '**.yaml'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - '**.yaml'
      - 'scripts/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Parse YAML syntax
        shell: bash
        run: |
          ruby -e "require 'yaml'; %w[template.yaml override.yaml].each { |file| YAML.safe_load_file(file); puts \"#{file}: valid YAML\" }"

      - name: Check proxy group references
        shell: pwsh
        run: ./scripts/validate-config.ps1
